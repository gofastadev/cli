name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# contents: write — goreleaser publishes the release; id-token +
# attestations: write — GitHub build-provenance attestation, so users
# can verify a downloaded binary was built by THIS workflow from THIS
# repo: `gh attestation verify <file> --repo gofastadev/cli`.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      - name: Download dependencies
        run: go mod download

      # Same -timeout as ci.yml's test job: the suite runs well past
      # `go test`'s 10-minute default under -race on cold module/build
      # caches, and a release must not fail on a timeout CI would pass.
      - name: Run tests
        run: go test -race -timeout 20m ./...

      - name: Verify build
        run: go build -o /dev/null ./cmd/gofasta/

      # syft powers goreleaser's SBOM generation (see .goreleaser.yaml's
      # sboms block) — one SPDX document per released archive.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest the checksums file: its digest transitively covers every
      # released archive, so one attestation proves the provenance of
      # the whole release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/checksums.txt
