name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Download dependencies
        run: go mod download

      # Same -timeout as ci.yml's test job: the suite runs well past
      # `go test`'s 10-minute default under -race on cold module/build
      # caches, and a release must not fail on a timeout CI would pass.
      - name: Run tests
        run: go test -race -timeout 20m ./...

      - name: Verify build
        run: go build -o /dev/null ./cmd/gofasta/

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
