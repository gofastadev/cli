name: Fuzz

# Weekly short-burst native Go fuzzing of the CLI's parser surfaces.
# The seed corpora (f.Add cases) already run as plain unit tests in
# every CI run; this job additionally explores new inputs. Findings
# land as failing corpus files in the job log.

on:
  schedule:
    - cron: "7 4 * * 2" # Tuesdays 04:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/generate, target: FuzzParseFields }
          - { pkg: ./internal/commands, target: FuzzDotEnvRoundTrip }
          - { pkg: ./internal/naming, target: FuzzNamingRoundTrip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s
